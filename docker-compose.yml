services:
  tonton:
    image: ghcr.io/matteoepitech/tonton-claude-relay:latest
    restart: unless-stopped
    ports:
      - "7777:7777"
    environment:
      TONTON_REGISTRATION: ${TONTON_REGISTRATION:-open}
      TONTON_ADMIN_TOKEN: ${TONTON_ADMIN_TOKEN:-}
    volumes:
      - tonton-data:/data

volumes:
  tonton-data:
