services:
  tonton:
    build: .
    restart: unless-stopped
    ports:
      - "7777:7777"
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL to the https address of your relay}
      TONTON_REGISTRATION: ${TONTON_REGISTRATION:-open}
      TONTON_ADMIN_TOKEN: ${TONTON_ADMIN_TOKEN:-}
    volumes:
      - ./data:/data
