name: Release

# Push a tag like v0.4.0 to publish everything at that version: the macOS app (DMG, and the appcast.xml it updates
# itself from when the update keys are set), the agents and their install scripts, the relay (executables, install
# script and Docker image) and a SHA256SUMS of the files.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  agents-and-relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test
      - name: Build the agents, the relay and the install scripts
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          bun run build --version "$VERSION"
          for script in install.sh install.ps1 install-relay.sh; do
            sed "s/__VERSION__/$VERSION/g" "scripts/$script" > "dist/$script"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: agents-and-relay
          path: dist/

  mac:
    runs-on: macos-15
    env:
      # Optional: with these secrets the app is signed with a Developer ID and notarized, and embeds its widget, whose app
      # group starts with the Team ID (see build-app.sh). Without them it is ad-hoc signed, without the widget.
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      # Optional: with this variable and the SPARKLE_PRIVATE_KEY secret, the app updates itself from the appcast.xml
      # published with each release (Sparkle). Without them it never checks.
      SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test
        working-directory: app
        run: swift test

      # Half a setup would ship apps that wait for a feed that never comes, or a feed no app can check.
      - name: Check the update keys
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -n "$SPARKLE_PUBLIC_KEY" ] && [ -n "$SPARKLE_PRIVATE_KEY" ]; then
            echo "UPDATES=on" >> "$GITHUB_ENV"
          elif [ -n "$SPARKLE_PUBLIC_KEY$SPARKLE_PRIVATE_KEY" ]; then
            echo "::error::Set both the SPARKLE_PUBLIC_KEY variable and the SPARKLE_PRIVATE_KEY secret, or neither."
            exit 1
          else
            echo "::notice::No update keys: this version of the app won't update itself."
          fi

      - name: Import the signing certificate
        if: env.MACOS_CERTIFICATE != ''
        run: |
          KEYCHAIN=$RUNNER_TEMP/signing.keychain-db
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

      - name: Build the app and the disk image
        working-directory: app
        run: |
          export VERSION=${GITHUB_REF_NAME#v}
          export SPARKLE_FEED_URL=https://github.com/$GITHUB_REPOSITORY/releases/latest/download/appcast.xml
          ./scripts/build-app.sh --universal
          ./scripts/make-dmg.sh

      # After notarization: the signature covers the image exactly as it is published.
      - name: Write the update feed
        if: env.UPDATES == 'on'
        working-directory: app
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          DMG=build/TontonClaude-${GITHUB_REF_NAME#v}.dmg
          GENERATE_APPCAST=$(find .build/artifacts -type f -name generate_appcast | head -n 1)
          [ -n "$GENERATE_APPCAST" ] || { echo "generate_appcast not found in Sparkle's package" >&2; exit 1; }
          mkdir -p build/updates
          cp "$DMG" build/updates/
          printf %s "$SPARKLE_PRIVATE_KEY" | "$GENERATE_APPCAST" --ed-key-file - \
            --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/" \
            --full-release-notes-url "https://github.com/$GITHUB_REPOSITORY/releases" \
            --link "https://github.com/$GITHUB_REPOSITORY" \
            -o build/appcast.xml build/updates
          swift scripts/check-appcast.swift build/appcast.xml "$DMG" build/TontonClaude.app

      - name: Build the agent's menu bar icon
        run: |
          for arch in arm64 x86_64; do
            swiftc -O -target $arch-apple-macos12 agent/tray/macos/main.swift -o "$RUNNER_TEMP/tray-$arch"
          done
          lipo -create "$RUNNER_TEMP/tray-arm64" "$RUNNER_TEMP/tray-x86_64" -output app/build/tonton-tray-darwin
          if [ -n "$CODESIGN_IDENTITY" ]; then
            codesign --force --options runtime --timestamp --sign "$CODESIGN_IDENTITY" app/build/tonton-tray-darwin
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            app/build/TontonClaude-*.dmg
            app/build/appcast.xml
            app/build/tonton-tray-darwin

  relay-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push ghcr.io/${{ github.repository }}-relay
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-relay
          docker buildx build --push --platform linux/amd64,linux/arm64 --build-arg VERSION="$VERSION" \
            --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" \
            --tag "$IMAGE:$VERSION" --tag "$IMAGE:latest" .

  publish:
    needs: [agents-and-relay, mac, relay-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          chmod +x tonton-* || true
          sha256sum * > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" * --title "Tonton Claude ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag
