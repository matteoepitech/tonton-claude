name: Release

# Push a tag like v0.3.0 to publish a release with the macOS app as a DMG.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  mac-app:
    runs-on: macos-15
    env:
      VERSION: ${{ github.ref_name }}
      # Optional: with these secrets the app is signed with a Developer ID and notarized; without them it is ad-hoc signed.
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test
        working-directory: app
        run: swift test

      - name: Import the signing certificate
        if: env.MACOS_CERTIFICATE != ''
        run: |
          KEYCHAIN=$RUNNER_TEMP/signing.keychain-db
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

      - name: Build the app and the disk image
        working-directory: app
        run: |
          export VERSION=${VERSION#v}
          ./scripts/build-app.sh --universal
          ./scripts/make-dmg.sh
          cd build && shasum -a 256 TontonClaude-*.dmg > SHA256SUMS.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" app/build/TontonClaude-*.dmg app/build/SHA256SUMS.txt \
            --title "Tonton Claude ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag
