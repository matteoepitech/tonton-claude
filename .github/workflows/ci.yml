name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  relay-and-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test
      - run: sh -n scripts/install.sh && sh -n scripts/install-relay.sh

  mac-app:
    runs-on: macos-15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - run: swift format lint --strict --configuration .swift-format --recursive Sources Tests ../agent/tray/macos ../ios
      - run: swift build
      - run: swift test
      # Every string the code shows is in Resources/Localizable.xcstrings. With the maintainer's compiler: another one
      # may list the strings a little differently.
      - run: ./scripts/sync-strings.sh --check
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      # The bundle as releases build it, with Sparkle and the widget embedded and signed. Any key and group will do:
      # nothing is published.
      - name: Build the app bundle
        run: SPARKLE_PUBLIC_KEY=$(head -c 32 /dev/urandom | base64) APP_GROUP=ABCDE12345.tech.d3l.tontonclaude ./scripts/build-app.sh
      - run: xmllint --noout Resources/TontonClaude.sdef
      - run: swiftc -O ../agent/tray/macos/main.swift -o "$RUNNER_TEMP/tonton-tray"

  # The iPhone app, its Live Activity and its notification extension, for the Simulator and without signing: the team
  # that publishes it signs its own builds.
  ios-app:
    runs-on: macos-15
    env:
      # The runner's default Xcode is 16; the project is built with the iOS 26 SDK, like the maintainer's.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - run: >-
          xcodebuild -project TontonClaude.xcodeproj -scheme TontonClaude -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/ios" CODE_SIGNING_ALLOWED=NO build

  raycast:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: raycast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsc --noEmit

  island-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test
      - run: bun scripts/build.ts
      - name: Run the island on the runner's desktop, against a relay
        shell: bash
        run: |
          (cd .. && PORT=7799 TONTON_DATA_DIR="$RUNNER_TEMP/relay" bun relay/src/main.ts > "$RUNNER_TEMP/relay.log" 2>&1 &)
          for _ in $(seq 30); do curl -sf http://127.0.0.1:7799/health && break; sleep 1; done
          mkdir -p "$RUNNER_TEMP/smoke" && cp test/smoke/* "$RUNNER_TEMP/smoke/" && cp -r dist "$RUNNER_TEMP/smoke/dist"
          TONTON_SMOKE_RELAY=http://127.0.0.1:7799 TONTON_SMOKE_OUT=out/screens bun x electron "$RUNNER_TEMP/smoke"
      - name: Build the installer, unsigned
        run: bun x electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: island-windows
          path: |
            desktop/out/*.exe
            desktop/out/screens/
          retention-days: 7

  island-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test
      - run: bun scripts/build.ts
      - name: Run the island on X11, and in a GNOME session on Wayland, against a relay
        run: |
          sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends mutter xwayland x11-utils xvfb
          # Chromium's sandbox needs user namespaces, which Ubuntu 24.04 keeps for apps with an AppArmor profile (the .deb has one).
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo mkdir -p /tmp/.X11-unix && sudo chmod 1777 /tmp/.X11-unix
          (cd .. && PORT=7799 TONTON_DATA_DIR="$RUNNER_TEMP/relay" bun relay/src/main.ts > "$RUNNER_TEMP/relay.log" 2>&1 &)
          for _ in $(seq 30); do curl -sf http://127.0.0.1:7799/health && break; sleep 1; done
          mkdir -p "$RUNNER_TEMP/smoke" && cp test/smoke/main.cjs test/smoke/package.json "$RUNNER_TEMP/smoke/" && cp -r dist "$RUNNER_TEMP/smoke/dist"
          bun x electron --version
          export TONTON_SMOKE_RELAY=http://127.0.0.1:7799 TONTON_SMOKE_OUT="$PWD/out/screens"
          xvfb-run -a -s "-screen 0 1600x1000x24" node_modules/electron/dist/electron "$RUNNER_TEMP/smoke"
          sh test/smoke/gnome-wayland.sh "$PWD/node_modules/electron/dist/electron" "$RUNNER_TEMP/smoke"
      - name: Build the AppImage and the .deb, unsigned
        run: bun x electron-builder --linux --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: island-linux
          path: |
            desktop/out/*.AppImage
            desktop/out/*.deb
            desktop/out/screens/
          retention-days: 7

  windows-scripts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse the PowerShell scripts
        shell: powershell
        run: |
          foreach ($file in 'scripts/install.ps1', 'agent/tray/windows/tray.ps1') {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path, [ref]$null, [ref]$errors)
            if ($errors) { $errors | ForEach-Object { Write-Error "${file}: $_" }; exit 1 }
          }
