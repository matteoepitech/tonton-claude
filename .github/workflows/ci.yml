name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  relay-and-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test

  mac-app:
    runs-on: macos-15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - run: swift format lint --strict --recursive Sources Tests
      - run: swift build
      - run: swift test
